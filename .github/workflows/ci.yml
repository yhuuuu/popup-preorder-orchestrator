name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: app
        run: npm ci

      - name: Run backend tests
        working-directory: app
        run: npm test

      - name: Build backend
        working-directory: app
        run: npm run build

      - name: Install frontend dependencies
        working-directory: web
        # npm ci is flaky here because some of rolldown's optional
        # platform-specific dependencies resolve differently between
        # macOS (where the lockfile is generated) and the Linux CI
        # runner. npm install re-resolves for the current platform.
        run: npm install

      - name: Run frontend lint
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: npm run build
